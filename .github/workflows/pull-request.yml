name: Pull Request Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  actions: read
  pull-requests: read

# Supersede in-flight runs when a PR is updated, so stale runs don't pile up
# and occupy runners. Grouped per PR.
concurrency:
  group: pr-checks-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  commitlint:
    name: Commit convention
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      # PRs are squash-merged, so the PR title becomes the commit subject on
      # main. That title is what has to be a Conventional Commit.
      - name: Lint the PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: echo "$PR_TITLE" | pnpm exec commitlint --verbose

  nx:
    name: Lint, typecheck, build & test (Nx)
    runs-on: ubuntu-latest
    # Hard ceiling for the job. Without it, GitHub's 360 min default lets a hung
    # step spin for hours.
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine Nx base/head
        id: nx-shas
        run: |
          echo "base=${{ github.event.pull_request.base.sha }}" >> "$GITHUB_OUTPUT"
          echo "head=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"

      # `gatekeeper` is excluded here and owned by the `go` job below, which has
      # the Go toolchain and golangci-lint installed.
      - name: Lint, typecheck, build & test
        run: |
          pnpm nx affected -t lint typecheck build test \
            --base="${{ steps.nx-shas.outputs.base }}" \
            --head="${{ steps.nx-shas.outputs.head }}" \
            --exclude=gatekeeper \
            --parallel=3 \
            --outputStyle=static

      # Unconditional, because `apps/router-api/schema.graphql` is what the
      # console's client is generated from: the first spec checks it against the
      # schema the resolvers produce, the second against the schema the running
      # application serves. Either failing means the committed SDL is stale.
      - name: Console schema drift
        run: pnpm exec vitest run --root apps/router-api src/app/api/graphql/schema.spec.ts test/schema.e2e.spec.ts

      # `apps/router-ui/src/generated` is never edited by hand. Regenerating it
      # from the committed schema has to be a no-op.
      - name: Generated GraphQL client is up to date
        run: |
          pnpm nx run @confidential-router/router-ui:codegen
          git diff --exit-code -- apps/router-ui/src/generated

      - name: Check formatting
        run: pnpm format:check

  router-api-postgres:
    name: router-api migrations (PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `nx affected` runs the unit and e2e suites on SQLite. This job is the one
    # that proves the same migrations apply to the database production uses.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: router
          POSTGRES_PASSWORD: router
          POSTGRES_DB: router
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U router -d router"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CR_TEST_POSTGRES_URL: postgres://router:router@127.0.0.1:5432/router
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Asserts both that every migration applies and that the resulting schema
      # is exactly the one the entities describe.
      - name: Migration and schema-drift tests
        run: pnpm exec vitest run --root apps/router-api src/app/db/migrations.spec.ts

      - name: Build router-api
        run: pnpm nx run @confidential-router/router-api:build

      # The command a deployment actually runs, against a real database.
      - name: Run the migration CLI
        working-directory: apps/router-api
        env:
          CR_API_CONFIG_FILE: /nonexistent.yaml
          CR_API_DATABASE__TYPE: postgres
          CR_API_DATABASE__URL: postgres://router:router@127.0.0.1:5432/router
          CR_API_AUTH__SECRET: ci-secret-not-used-for-anything-real-32
        run: node dist/cli/run-migrations.js

      - name: Re-run it, to prove it is idempotent
        working-directory: apps/router-api
        env:
          CR_API_CONFIG_FILE: /nonexistent.yaml
          CR_API_DATABASE__TYPE: postgres
          CR_API_DATABASE__URL: postgres://router:router@127.0.0.1:5432/router
          CR_API_AUTH__SECRET: ci-secret-not-used-for-anything-real-32
        run: node dist/cli/run-migrations.js

  e2e:
    name: Console e2e (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Only the browser the suite actually uses; `--with-deps` pulls the shared
      # libraries the headless build links against on a bare runner.
      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      # `nx affected` would skip the suite on a PR that only touches, say, the
      # gatekeeper — which is the point. The `e2e` target builds the app first.
      - name: Run the console e2e suite
        run: |
          pnpm nx affected -t e2e \
            --base="${{ github.event.pull_request.base.sha }}" \
            --head="${{ github.event.pull_request.head.sha }}" \
            --outputStyle=static

      - name: Upload the Playwright report
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            apps/router-ui-e2e/playwright-report
            test-output/playwright
          retention-days: 7


  # The two latent bugs this job exists to catch were both real: a package
  # required by a build config and declared nowhere, resolving on a laptop only
  # through a pnpm shim that exports NODE_PATH. `nx affected` cannot see either,
  # because both builds are green outside a container.
  images:
    name: Container images build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Read-only against the cache the release workflow writes on main: a PR
      # must not be able to poison what a release build starts from.
      - name: Build router-api
        uses: docker/build-push-action@v6
        with:
          context: .
          file: router-api.dockerfile
          push: false
          cache-from: type=gha,scope=router-api

      - name: Build router-ui
        uses: docker/build-push-action@v6
        with:
          context: .
          file: router-ui.dockerfile
          push: false
          cache-from: type=gha,scope=router-ui

  go:
    name: Go checks (gatekeeper)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The same steps the release workflow runs before it publishes anything.
      - name: vet, test, static build and lint
        uses: ./.github/actions/go-checks
