# golangci-lint v2 configuration for the Go gatekeeper.
# Run locally with `pnpm nx run gatekeeper:lint`.
version: "2"

run:
  timeout: 5m

linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - misspell
    - revive
    - unconvert
  exclusions:
    presets:
      - std-error-handling
    rules:
      - path: _test\.go$
        linters:
          - gosec
      # A verbatim copy of sp-nodejs-addons' azurecvm (see its package
      # comment); kept byte-identical to upstream rather than restyled here.
      - path: pkg/attestation/attestedroot/internal/azurecvm/
        linters:
          - gosec
          - revive

formatters:
  enable:
    - gofmt
    - goimports
