"""Why a presented invitation code did not credit this account."""
enum InviteRefusalReason {
  ALREADY_REDEEMED
  DISABLED
  ERROR
  EXHAUSTED
  EXPIRED
  NOT_FOUND
}

"""
How many withdrawn invitation codes an operator put back. Operators only.
"""
type InviteRestoration {
  """Codes the target matched that were never withdrawn."""
  alreadyUsable: Int!
  matched: Int!

  """Codes this call put back into circulation."""
  restored: Int!
  target: String!
}

"""How many invitation codes an operator withdrew. Operators only."""
type InviteWithdrawal {
  """
  Codes already withdrawn before this call; their timestamps were left alone.
  """
  alreadyWithdrawn: Int!

  """
  Codes the target matched. Zero means there is no such code or campaign.
  """
  matched: Int!

  """
  Codes left in circulation because every seat is spent — `unspentOnly` only.
  """
  spent: Int!

  """The code or campaign acted on, echoed back normalised."""
  target: String!

  """Codes this call withdrew. No further sign-up can redeem them."""
  withdrawn: Int!
}

"""Arbitrary JSON, serialised as-is."""
scalar JSON

"""What one API key spent in a period."""
type KeyUsage {
  """Null once the key has been deleted."""
  apiKeyId: ID
  completionTokens: Int!

  """Of `requests`, how many the endpoint had published evidence for."""
  coveredRequests: Int!

  """
  0–1, over the requests this deployment’s own endpoints served. Zero when there were none. Generations routed to an external endpoint are outside this ratio, not counted as uncovered.
  """
  evidenceCoverage: Float!
  name: String!
  prefix: String
  promptTokens: Int!
  requests: Int!

  """Spend in micro-USD."""
  spendMicros: String!
}

"""A measurement register the producer published (MRTD, RTMR0-2, GPU…)."""
type Measurement {
  name: String!
  value: String!
}

"""Which anchor vouched for the measurement the verdict saw (SUP-139)."""
enum MeasurementSource {
  OPERATOR_PINNED
  REGISTRY
}

"""
A model the router can route to: declared in the router config, or registered on an external endpoint and attested by this router (ADR-008). `origin` says which, and decides which of `endpoint` / `externalUpstream` is populated.
"""
type Model {
  """
  Whether this router will route to it right now. Always true for a CONFIG model; for an EXTERNAL one it is false unless the endpoint holds a live verdict admitting it.
  """
  available: Boolean!
  capabilities: [ModelCapability!]!
  contextLength: Int!

  """
  The endpoint that serves it — what the user attests. Null for an EXTERNAL model: this router publishes no evidence for another deployment’s hostname. Read `externalUpstream` instead.
  """
  endpoint: Endpoint

  """
  The upstream behind an EXTERNAL model. Null for a CONFIG model, and null for an anonymous caller whatever the origin (SUP-221 ruling 3).
  """
  externalUpstream: ExternalUpstream

  """The public model id, e.g. meta/llama-3.3-70b-instruct:tdx."""
  id: ID!
  name: String!

  """Whether this model runs in this deployment or in another one."""
  origin: ModelOrigin!
  pricing: Pricing!

  """Same value as `id`; the console calls it the slug."""
  slug: String!

  """
  Denormalised from the endpoint so a model list needs no join. Null for an EXTERNAL model: the operator declares no TEE label for another deployment’s hardware, and a measurement admits a cloud rather than naming its silicon.
  """
  tee: String
}

enum ModelCapability {
  CHAT
  COMPLETIONS
  EMBEDDINGS
}

"""
CONFIG is a model inside this deployment’s own cluster space, declared in the router config and therefore covered by the canonical snapshot a user pins. EXTERNAL is a model in another deployment, reached through this router’s attesting egress — the pin covers the verifier, not the upstream (ADR-008 §1).
"""
enum ModelOrigin {
  CONFIG
  EXTERNAL
}

"""What one model was used for in a period, most expensive first."""
type ModelUsage {
  completionTokens: Int!

  """Of `requests`, how many the endpoint had published evidence for."""
  coveredRequests: Int!

  """
  0–1, over the requests this deployment’s own endpoints served. Zero when there were none. Generations routed to an external endpoint are outside this ratio, not counted as uncovered.
  """
  evidenceCoverage: Float!
  modelId: ID!
  name: String!
  promptTokens: Int!
  requests: Int!

  """Spend in micro-USD."""
  spendMicros: String!
}

type Mutation {
  """
  Admits one more cloud — one of the two trust factors; each endpoint also needs its own deployment digest pinned (pinExternalEndpointDigest). Takes effect on the next check, not after the re-attest interval. Restricted to auth.adminEmails.
  """
  addTrustedMeasurement(input: AddTrustedMeasurementInput!): TrustedMeasurement!

  """
  Records one turn that has already happened. This does not call a model — the browser does that over /v1/chat/completions, like any other client.
  """
  appendChatMessage(input: AppendChatMessageInput!): ChatMessage!

  """
  A short-lived key for the console chat. Rotates: this user’s own previous chat key in the workspace is revoked, and no one else’s.
  """
  chatCredential(input: ChatCredentialInput!): ChatCredential!

  """
  Creates a key and returns its secret. The secret is never retrievable again.
  """
  createApiKey(input: CreateApiKeyInput!): ApiKeyCreated!

  """
  Starts a conversation. The member’s oldest is pruned when they are at `maxThreads`.
  """
  createChatThread(input: CreateChatThreadInput!): ChatThread!

  """Starts a top-up. Credit appears once the provider confirms."""
  createCheckout(input: CreateCheckoutInput!): CheckoutSession!

  """
  Deletes a conversation and its turns outright. There is no archive and no tombstone.
  """
  deleteChatThread(threadId: ID!, workspaceId: ID!): Boolean!

  """
  Withdraws one invitation code or a campaign’s. Credit already granted is untouched. Restricted to auth.adminEmails.
  """
  disableInviteCodes(input: DisableInviteCodesInput!): InviteWithdrawal!

  """An expiring link to the evidence for a period."""
  exportEvidence(from: DateTime!, to: DateTime!, workspaceId: ID!): EvidenceExport!

  """
  Approves one deployment: pins the evidence digest this endpoint must publish, the second trust factor beside the cloud measurement. Replaces any earlier pin — approving a redeploy is this call with the new digest. Takes effect on the next check, which the sidecar runs at once. Restricted to auth.adminEmails.
  """
  pinExternalEndpointDigest(id: ID!, input: PinExternalEndpointDigestInput!): ExternalEndpoint!
  refreshEvidence(endpointId: ID!): EvidenceSnapshot

  """
  Registers an upstream. It serves nothing until the egress sidecar reports a verdict admitting it, so the row starts PENDING. Restricted to auth.adminEmails.
  """
  registerExternalEndpoint(input: RegisterExternalEndpointInput!): ExternalEndpoint!

  """
  Withdraws a cloud. Live and fail-closed: every endpoint admitted only by this measurement is denied on the next forced check, which drops its models from /v1/models. Restricted to auth.adminEmails.
  """
  removeTrustedMeasurement(id: ID!): Boolean!

  """
  Puts withdrawn invitation codes back into circulation. Restricted to auth.adminEmails.
  """
  restoreInviteCodes(input: RestoreInviteCodesInput!): InviteRestoration!

  """Revokes a key. Idempotent; the row is kept for its generations."""
  revokeApiKey(id: ID!): ApiKey!

  """
  Replaces the stored upstream API key. There is no read path for the old one. Restricted to auth.adminEmails.
  """
  rotateExternalEndpointKey(id: ID!, input: RotateExternalEndpointKeyInput!): ExternalEndpoint!

  """Turns automatic top-up on or off."""
  setAutoTopUp(input: SetAutoTopUpInput!): CreditBalance!

  """Switches the model a conversation talks to."""
  setChatThreadModel(input: CreateChatThreadInput!, threadId: ID!): ChatThread!

  """
  Switches an endpoint off, or back on. Off removes it from the sidecar config entirely; on returns it to PENDING so it re-attests before it serves. Restricted to auth.adminEmails.
  """
  setExternalEndpointEnabled(id: ID!, input: SetExternalEndpointEnabledInput!): ExternalEndpoint!

  """
  Sets a first password on the viewer’s account. Refused when the account already has one.
  """
  setPassword(input: SetPasswordInput!): User!
  updateApiKey(id: ID!, input: UpdateApiKeyInput!): ApiKey!

  """
  Re-points or re-prices an endpoint. The name is immutable — it is the sidecar’s key for this upstream. Restricted to auth.adminEmails.
  """
  updateExternalEndpoint(id: ID!, input: UpdateExternalEndpointInput!): ExternalEndpoint!

  """Updates the settings named; leaves the rest alone."""
  updatePreferences(input: UpdatePreferencesInput!): UserPreferences!

  """Changes the viewer’s display name."""
  updateProfile(input: UpdateProfileInput!): User!

  """
  Rewrites the note beside an entry. The measurement itself is immutable. Restricted to auth.adminEmails.
  """
  updateTrustedMeasurement(input: UpdateTrustedMeasurementInput!): TrustedMeasurement!
}

type PageInfo {
  """Cursor of the last edge, to pass as `after`."""
  endCursor: String
  hasNextPage: Boolean!
}

input PinExternalEndpointDigestInput {
  """
  The deployment to approve: sha256:<64 hex> (what the console shows) or sha256/<base64url>. Normalised. Replaces any earlier pin.
  """
  evidenceDigest: String!
}

"""
Frozen at request time onto every generation, so a config change cannot rewrite history.
"""
type Pricing {
  """Micro-USD per 1M completion tokens."""
  completionPer1m: String!

  """
  Micro-USD per 1M prompt tokens, as a string so no precision is lost in JSON.
  """
  promptPer1m: String!
}

type Query {
  """The same totals, bucketed. Quiet buckets are zeroes."""
  activitySeries(
    bucket: Bucket!

    """Inclusive start of the range."""
    from: DateTime!

    """Exclusive end of the range."""
    to: DateTime!
    workspaceId: ID!
  ): [ActivityPoint!]!

  """Spend, traffic, latency and evidence coverage for a period."""
  activitySummary(
    """Inclusive start of the range."""
    from: DateTime!

    """Exclusive end of the range."""
    to: DateTime!
    workspaceId: ID!
  ): ActivitySummary!

  """Every key in the workspace, newest first."""
  apiKeys(workspaceId: ID!): [ApiKey!]!

  """Limits and history location for the console chat. Public."""
  chatSettings: ChatSettings!

  """One conversation with its turns, oldest first."""
  chatThread(threadId: ID!, workspaceId: ID!): ChatThread!

  """
  This member’s conversations in the workspace, most recently used first. Titles only.
  """
  chatThreads(workspaceId: ID!): [ChatThread!]!

  """Balance, admission state and automatic top-up settings."""
  creditBalance(workspaceId: ID!): CreditBalance!

  """The credits ledger, newest first."""
  creditTransactions(after: String, first: Int! = 20, workspaceId: ID!): CreditTransactionConnection!

  """
  Asks a VERIFIED_BY_THIS_ROUTER endpoint for its own GET /v1/models, through the attested egress — never before the verdict: an endpoint that is not verified is refused with CONFLICT and nothing is sent. Read-only; register the chosen models with updateExternalEndpoint. Restricted to auth.adminEmails, because the call carries the stored upstream key.
  """
  discoverExternalModels(id: ID!): [DiscoveredExternalModel!]!

  """
  The router hostnames the platform publishes evidence for, with what each currently publishes.
  """
  endpoints(workspaceId: ID!): [Endpoint!]!

  """
  Share of the workspace’s generations served while the endpoint had a fresh bundle published.
  """
  evidenceCoverage(
    """Narrow to the generations one endpoint served."""
    endpointId: ID
    from: DateTime!
    to: DateTime!
    workspaceId: ID!
  ): EvidenceCoverage!

  """
  Each distinct digest this endpoint has published — when a pinned value would have had to change.
  """
  evidenceDigestHistory(endpointId: ID!, limit: Int! = 20): [EvidenceDigestChange!]!

  """Everything this endpoint has published, newest first."""
  evidenceSnapshots(after: String, endpointId: ID!, first: Int! = 20): EvidenceSnapshotConnection!

  """One external endpoint, by id."""
  externalEndpoint(id: ID!): ExternalEndpoint

  """
  Every registered external endpoint with what this router currently says about it. Read-only for any signed-in user; operator fields are null for everyone else.
  """
  externalEndpoints: [ExternalEndpoint!]!

  """
  Whether to offer the viewer a second grant for feedback, and the form link to do it with.
  """
  feedbackOffer: FeedbackOffer!

  """
  The published gatekeeper build, or null when none has been retrieved yet.
  """
  gatekeeperRelease: GatekeeperRelease

  """The generation log, filtered, sorted and paginated."""
  generations(after: String, filter: GenerationFilter, first: Int! = 50, sort: GenerationSort, workspaceId: ID!): GenerationConnection!

  """Invitation campaign conversion. Restricted to auth.adminEmails."""
  inviteCampaigns(campaign: String): [InviteCampaignStats!]!

  """The viewer’s invitation credit, or null if they never redeemed one."""
  inviteGrant: InviteGrant

  """
  The viewer’s invitation credit, or why the code they signed up with did not apply.
  """
  inviteGrantStatus(
    """The code the sign-up carried, if any."""
    code: String
  ): InviteGrantStatus!

  """The signed-in user, or an error when anonymous."""
  me: User!

  """One routable model, by id. Public."""
  model(id: ID!): Model

  """Routable models, in config order. Public."""
  models(
    """Narrow to one TEE label."""
    tee: String
  ): [Model!]!

  """
  The endpoint this deployment publishes evidence for — the one a browser’s connection terminates at, and therefore the one a page can verify. Null when this router cannot tell which of its endpoints is its own.
  """
  routerEndpoint: Endpoint

  """The sign-in paths this deployment offers. Public."""
  signInOptions: SignInOptions!

  """
  UTC days on which at least one generation was served with published evidence.
  """
  signedResponseDays(days: Int! = 365, workspaceId: ID!): [DateTime!]!

  """API keys by spend, highest first."""
  topKeys(
    """Inclusive start of the range."""
    from: DateTime!
    limit: Int! = 5

    """Exclusive end of the range."""
    to: DateTime!
    workspaceId: ID!
  ): [KeyUsage!]!

  """
  The measurements this deployment accepts for an external upstream. Read-only for any signed-in user: a trust list only the operator can see is not a trust list anyone can audit.
  """
  trustedMeasurements: [TrustedMeasurement!]!

  """Models by spend, highest first."""
  usageByModel(
    """Inclusive start of the range."""
    from: DateTime!

    """Omit for every model; set it for "top models by spend"."""
    limit: Int

    """Exclusive end of the range."""
    to: DateTime!
    workspaceId: ID!
  ): [ModelUsage!]!
}

input RegisterExternalEndpointInput {
  """
  The upstream’s own LLM API key. Write-only: it is sealed before it reaches a column and no query returns it — only `apiKeyPrefix` comes back.
  """
  apiKey: String!

  """
  https://host[:port]. Plain HTTP is refused — there is no channel to pin.
  """
  baseUrl: String!

  """The models to publish, with this router’s prices."""
  models: [ExternalModelInput!]!

  """Lower-case letters, digits and hyphens; also the sidecar’s key."""
  name: String!
}

input RestoreInviteCodesInput {
  """Every code of one campaign."""
  campaign: String

  """One code, in any spelling."""
  code: String
}

input RotateExternalEndpointKeyInput {
  """
  The replacement upstream key. Rotation is a write; there is nothing to read.
  """
  apiKey: String!
}

input SetAutoTopUpInput {
  settings: AutoTopUpInput!
  workspaceId: ID!
}

input SetExternalEndpointEnabledInput {
  """
  Switching it back on returns it to PENDING: it re-attests from nothing.
  """
  enabled: Boolean!
}

input SetPasswordInput {
  """
  The password to sign in with. `auth.password.minLength` is enforced by the router, not here.
  """
  password: String!
}

"""Which sign-in paths this deployment offers."""
type SignInOptions {
  """
  A bootstrap token can create the first account right now: one is configured and the deployment has no user yet. False on every deployment that has already been signed into.
  """
  bootstrap: Boolean!

  """A GitHub OAuth app is configured."""
  github: Boolean!

  """A Google OAuth app is configured."""
  google: Boolean!

  """
  Registration is by invitation: no sign-up path on this deployment creates an account without an invitation code that is valid and unredeemed. Signing in to an existing account is unaffected.
  """
  inviteRequired: Boolean!

  """A mailer is configured, so a one-time link can be sent."""
  magicLink: Boolean!

  """
  Email and password sign-in and sign-up are enabled. There is no email verification and no password reset: this path exists for deployments with no mail delivery at all.
  """
  password: Boolean!

  """
  The shortest password this deployment accepts, so the sign-up form can state the rule instead of discovering it. Meaningless while `password` is false.
  """
  passwordMinLength: Int!
}

enum SortDirection {
  ASC
  DESC
}

"""
One VM launch measurement this deployment accepts for an external upstream. It admits a *cloud*, never a deployment: any TEE on a listed cloud satisfies it. Removing one denies dependent endpoints on the next check.
"""
type TrustedMeasurement {
  addedAt: DateTime!

  """Email of the operator who added it. Null for a non-operator."""
  addedByEmail: String

  """
  Registered endpoints this row currently admits — what removing it would drop. Computed from the measurement each endpoint’s last verdict saw, so it is a statement about the last check and not a promise about the next one.
  """
  admits: Int!
  id: ID!

  """64 lower-case hex characters, normalised on input."""
  measurement: String!

  """Why this cloud is trusted, in the operator’s own words."""
  note: String
}

input UpdateApiKeyInput {
  expiresAt: DateTime

  """Replaces the scope. An empty list clears it."""
  modelIds: [String!]
  name: String
  requestsPerMinute: Int
  spendLimitMicros: String
  tokensPerMinute: Int
}

input UpdateExternalEndpointInput {
  baseUrl: String

  """
  Replaces the registered set. A model left out is retired, never deleted.
  """
  models: [ExternalModelInput!]
}

input UpdatePreferencesInput {
  archiveEvidence: Boolean
  desktopNotifications: Boolean
  emailReceipts: Boolean
  evidenceRetentionDays: Int
  notifyOnMeasurementChange: Boolean
}

input UpdateProfileInput {
  """The display name shown in the console. Blank is not a name."""
  name: String!
}

input UpdateTrustedMeasurementInput {
  id: ID!

  """Null or blank clears the note. The measurement is immutable."""
  note: String
}

"""The signed-in console user."""
type User {
  """Profile picture from the OAuth provider, when there is one."""
  avatarUrl: String

  """When the account was created — “member since” on the Profile screen."""
  createdAt: DateTime!
  email: String!

  """
  Whether the viewer can sign in with a password. False for an account made by the bootstrap token, a magic link or OAuth until `setPassword` gives it one.
  """
  hasPassword: Boolean!
  id: ID!

  """
  Whether this address is in `auth.adminEmails` — the one question the browser could not ask before ADR-008 §7. It gates the admin section’s nav entry; it is not itself a permission, because every operator-only operation is behind `AdminGuard` whatever a client believes.
  """
  isAdmin: Boolean!
  name: String

  """The viewer’s console settings."""
  preferences: UserPreferences!

  """Every workspace the viewer is a member of, oldest first."""
  workspaces: [Workspace!]!
}

"""Console settings, including the Evidence group."""
type UserPreferences {
  """Keep the published bundle and JWS, not just the digests."""
  archiveEvidence: Boolean!
  desktopNotifications: Boolean!
  emailReceipts: Boolean!

  """How long archived bundles are kept, in days. Digests are kept forever."""
  evidenceRetentionDays: Int!

  """Notify when an endpoint publishes different measurements."""
  notifyOnMeasurementChange: Boolean!
}

"""A workspace the viewer belongs to."""
type Workspace {
  """
  Credit balance in micro-USD, as a string so no precision is lost in JSON.
  """
  balanceMicros: String!
  id: ID!
  name: String!

  """The role the viewer holds here."""
  role: WorkspaceRole!
  slug: String!
}

"""
An owner may spend the workspace’s credits; a member may only use them.
"""
enum WorkspaceRole {
  MEMBER
  OWNER
}
